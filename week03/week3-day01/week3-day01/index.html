<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./output.css">
    <title>NavBar</title>
</head>

<body>
    <!-- NAVBAR -->
    <nav class="bg-gradient-to-r from-[#2a2a2a] to-[#1f1f1f] text-gray-300">

        <div class="max-w-[1200px] mx-auto flex items-center justify-between px-6 h-14">

            <!-- LEFT SIDE -->
            <div class="flex items-center gap-8">

                <!-- LOGO PLACEHOLDER -->
                <!-- Replace this div with your logo image -->
                 
                <div class="w-10 h-10 bg-gray-700 flex items-center justify-center text-xs font-bold">

                    <img src="./design/logo.png" alt="#" class="h-8">

                </div>

                <!-- DESKTOP NAVIGATION -->
                <ul class="hidden md:flex items-center gap-6 text-sm tracking-wide">

                    <!-- Active Link -->
                    <li class="relative">
                        <a href="#" class="text-white font-medium">STORE</a>
                        <span class="absolute left-0 -bottom-3 w-full h-[2px] bg-blue-500"></span>
                    </li>

                    <li><a href="#" class="hover:text-white transition">FAQ</a></li>
                    <li><a href="#" class="hover:text-white transition">HELP</a></li>
                    <li><a href="#" class="hover:text-white transition">UNREAL ENGINE</a></li>

                </ul>

            </div>


            <!-- RIGHT SIDE -->
            <div class="flex items-center gap-5">

                <!-- Globe Icon -->
                <button class="hidden md:block text-gray-400 hover:text-white text-lg">
                    🌐
                </button>

                <!-- Sign In -->
                <a href="#" class="hidden md:block text-sm hover:text-white">
                    SIGN IN
                </a>

                <!-- Download Button -->
                <a href="#"
                    class="hidden md:block bg-blue-600 hover:bg-blue-700 text-white text-sm px-4 py-2 rounded-sm font-medium transition">
                    DOWNLOAD
                </a>

                <!-- HAMBURGER BUTTON (Mobile Only) -->
                <button id="menu-btn" class="md:hidden flex flex-col gap-1">
                    <span class="w-6 h-[2px] bg-white"></span>
                    <span class="w-6 h-[2px] bg-white"></span>
                    <span class="w-6 h-[2px] bg-white"></span>
                </button>

            </div>

        </div>


        <!-- MOBILE MENU -->
        <div id="mobile-menu" class="hidden md:hidden bg-[#1f1f1f] px-6 pb-4">

            <ul class="flex flex-col gap-4 text-sm">

                <li><a href="#" class="block hover:text-white">STORE</a></li>
                <li><a href="#" class="block hover:text-white">FAQ</a></li>
                <li><a href="#" class="block hover:text-white">HELP</a></li>
                <li><a href="#" class="block hover:text-white">UNREAL ENGINE</a></li>

                <li class="pt-2 border-t border-gray-700">
                    <a href="#" class="block hover:text-white">SIGN IN</a>
                </li>

                <li>
                    <a href="#" class="block bg-blue-600 text-center py-2 rounded-sm text-white">
                        DOWNLOAD
                    </a>
                </li>

            </ul>

        </div>

    </nav>


    <!-- JAVASCRIPT TOGGLE -->
    <script>
        const menuBtn = document.getElementById("menu-btn");
        const mobileMenu = document.getElementById("mobile-menu");

        menuBtn.addEventListener("click", () => {
            mobileMenu.classList.toggle("hidden");
        });
    </script>

</body>

</html>
