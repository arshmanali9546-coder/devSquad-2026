<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./output.css">
    <title>Login PaGE</title>
</head>

<body class="bg-blue-100 flex items-center justify-center min-h-screen">

<!-- Main Container -->
<div class="bg-white rounded-xl shadow-lg overflow-hidden w-[900px] flex">

    <!-- Left Section -->
    <div class="w-1/2 bg-blue-600 text-white p-12 flex flex-col justify-between">

        <!-- Logo -->
        <h1 class="text-2xl font-semibold">Netixsol</h1>

        <!-- Illustration -->
        <div class="flex justify-center">
            <img src="/assets/nnn.webp" class="w-50 h-50 object-cover mt-5 justify-center" alt="Illustration">
        </div>

        <!-- Text -->
        <div>
            <h2 class="text-3xl font-bold mb-2">Welcome!</h2>
            <p class="text-blue-100 text-sm">
                To Netixsol, your one-stop solution for all your needs.WEB3 GREEKS 
            </p>

            <!-- Slider dots -->
            <div class="flex gap-2 mt-6">
                <span class="w-3 h-3 bg-white rounded-full"></span>
                <span class="w-3 h-3 border border-white rounded-full"></span>
                <span class="w-3 h-3 border border-white rounded-full"></span>
            </div>
        </div>

    </div>


    <!-- Right Section -->
    <div class="w-1/2 p-12">

        <!-- LOGIN FORM -->
        <div id="loginForm">

            <h2 class="text-3xl font-semibold text-blue-500 mb-4">
                Log In
            </h2>

            <p class="text-sm text-gray-500 mb-6">
                Don't have an account?
                <button onclick="showSignup()" class="text-blue-500 font-medium">
                    Create an account
                </button>
            </p>

            <!-- Username -->
            <input
                type="text"
                placeholder="Username"
                class="w-full border-b py-2 mb-6 outline-none"
            >

            <!-- Password -->
            <input
                type="password"
                placeholder="Password"
                class="w-full border-b py-2 mb-6 outline-none"
            >

            <!-- Button -->
            <button
                class="bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600">
                Sign in
            </button>

            <div class="mt-4 text-sm text-blue-500 cursor-pointer">
                Forgot your password?
            </div>

        </div>


        <!-- SIGNUP FORM -->
        <div id="signupForm" class="hidden">

            <h2 class="text-3xl font-semibold text-blue-500 mb-4">
                Create Account
            </h2>

            <p class="text-sm text-gray-500 mb-6">
                Already have an account?
                <button onclick="showLogin()" class="text-blue-500 font-medium">
                    Login
                </button>
            </p>

            <input
                type="text"
                placeholder="Full Name"
                class="w-full border-b py-2 mb-4 outline-none"
            >

            <input
                type="email"
                placeholder="Email"
                class="w-full border-b py-2 mb-4 outline-none"
            >

            <input
                type="password"
                placeholder="Password"
                class="w-full border-b py-2 mb-6 outline-none"
            >

            <button
                class="bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600">
                Sign Up
            </button>

        </div>

    </div>

</div>


<script src="app.js"></script>

</body>

</html>
